name: Daily TRD Export

on:
  schedule:
    # Runs at 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated file back to the repo

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Test connectivity
        run: curl -v --max-time 15 https://trd.grupatopex.com:5051/auth/login || true

      - name: Run export script
        env:
          TRD_USERNAME: ${{ secrets.TRD_USERNAME }}
          TRD_PASSWORD: ${{ secrets.TRD_PASSWORD }}
        run: python trd_export.py

      - name: Commit and push updated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_and_availability.xlsx
          git diff --quiet --cached || git commit -m "Daily export $(date -u +'%Y-%m-%d')"
          git push
